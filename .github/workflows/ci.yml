# Generated by workflow.py

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # publish.yml calls this, so a release re-runs every gate before it ships

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    # service containers are a Linux-runner feature, so the live tests belong here
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mariadb:12
        env:
          MARIADB_ROOT_PASSWORD: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # the suite reads these; unset, it skips whatever needs a server
      XAEIAN_TEST_POSTGRES: ci
      XAEIAN_TEST_MYSQL: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ".[all]"
      - run: python -m pytest tests -q

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"] # the ends of the range: the middle is covered on Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ".[all]"
      # no server here, so whatever needs one skips itself
      - run: python -m pytest tests -q

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install pytest mypy "$(echo dist/*.whl)[all]"
      # pyproject carries the pytest config; no source tree beside it, so the wheel answers
      - run: mkdir /tmp/t && cp -r tests pyproject.toml /tmp/t/
      - run: cd /tmp/t && python -m pytest tests
